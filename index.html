<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stream Player</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap');

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #08090d;
  --surface: #0f1117;
  --card: #13151e;
  --border: rgba(255,255,255,0.07);
  --accent: #4f8ef7;
  --accent-dim: rgba(79,142,247,0.12);
  --accent-glow: rgba(79,142,247,0.25);
  --text: #f0f2f8;
  --sub: #6b7280;
  --sub2: #374151;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* ═══════════════════════════════════
   LOADER
═══════════════════════════════════ */
#loader {
  position: fixed;
  inset: 0;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  gap: 20px;
  transition: opacity 0.5s ease, visibility 0.5s;
}
#loader.out {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.loader-logo {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 1.6rem;
  letter-spacing: -0.5px;
  color: var(--text);
}
.loader-logo span { color: var(--accent); }

.loader-bar-track {
  width: 160px;
  height: 2px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}
.loader-bar-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 2px;
  animation: barFill 1.8s cubic-bezier(.4,0,.2,1) forwards;
}
@keyframes barFill {
  from { width: 0; }
  to   { width: 100%; }
}

.loader-dots {
  display: flex;
  gap: 6px;
}
.loader-dots span {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--sub2);
  animation: dotPulse 1.2s ease-in-out infinite;
}
.loader-dots span:nth-child(2) { animation-delay: .2s; }
.loader-dots span:nth-child(3) { animation-delay: .4s; }
@keyframes dotPulse {
  0%,100% { background: var(--sub2); transform: scale(1); }
  50%      { background: var(--accent); transform: scale(1.4); }
}

/* ═══════════════════════════════════
   MAIN LAYOUT
═══════════════════════════════════ */
#app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 16px 48px;
  opacity: 0;
  transform: translateY(12px);
  transition: opacity 0.6s ease, transform 0.6s ease;
}
#app.visible {
  opacity: 1;
  transform: translateY(0);
}

.wrap {
  width: 100%;
  max-width: 820px;
  display: flex;
  flex-direction: column;
  gap: 0;
}

/* ═══════════════════════════════════
   HEADER
═══════════════════════════════════ */
.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 28px;
}
.logo {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 1.25rem;
  letter-spacing: -0.3px;
  color: var(--text);
}
.logo em {
  font-style: normal;
  color: var(--accent);
}
.live-pill {
  display: flex;
  align-items: center;
  gap: 7px;
  background: var(--accent-dim);
  border: 1px solid rgba(79,142,247,0.2);
  border-radius: 20px;
  padding: 5px 12px;
  font-size: .7rem;
  font-weight: 500;
  color: var(--accent);
  letter-spacing: .5px;
}
.live-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent);
  animation: liveBlink 1.6s ease-in-out infinite;
}
@keyframes liveBlink {
  0%,100% { opacity: 1; }
  50%      { opacity: 0.3; }
}

/* ═══════════════════════════════════
   INPUT SECTION
═══════════════════════════════════ */
.input-section {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 12px;
}

.input-row {
  display: flex;
  gap: 10px;
}

.url-input {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: .9rem;
  font-weight: 400;
  padding: 13px 16px;
  outline: none;
  transition: border-color .2s, box-shadow .2s;
  min-width: 0;
}
.url-input::placeholder { color: var(--sub2); }
.url-input:focus {
  border-color: rgba(79,142,247,0.45);
  box-shadow: 0 0 0 3px rgba(79,142,247,0.08);
}

.play-btn {
  background: var(--accent);
  border: none;
  border-radius: 10px;
  color: #fff;
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: .8rem;
  letter-spacing: .5px;
  padding: 0 22px;
  cursor: pointer;
  white-space: nowrap;
  transition: opacity .15s, transform .15s, box-shadow .15s;
  box-shadow: 0 4px 20px rgba(79,142,247,0.3);
  display: flex;
  align-items: center;
  gap: 7px;
}
.play-btn:hover  { opacity: .88; transform: translateY(-1px); box-shadow: 0 6px 24px rgba(79,142,247,0.4); }
.play-btn:active { opacity: 1;   transform: translateY(0);    box-shadow: none; }
.play-btn svg { flex-shrink: 0; }

/* ═══════════════════════════════════
   PLAYER BOX
═══════════════════════════════════ */
.player-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
}

/* empty / loading states */
.state {
  min-height: 380px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  text-align: center;
  padding: 40px 24px;
}

.state-icon {
  width: 56px; height: 56px;
  border-radius: 14px;
  background: var(--accent-dim);
  border: 1px solid rgba(79,142,247,0.15);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
}

.state h3 {
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: .95rem;
  color: var(--text);
}
.state p {
  font-size: .8rem;
  color: var(--sub);
  max-width: 260px;
  line-height: 1.6;
}

/* spinner for loading */
.spinner {
  width: 36px; height: 36px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .75s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* iframe */
#playerArea iframe {
  width: 100%;
  height: 480px;
  border: none;
  display: block;
  background: #000;
}

@media (max-width: 500px) {
  #playerArea iframe { height: 220px; }
  .play-btn { padding: 0 16px; }
}
@media (min-width: 501px) and (max-width: 700px) {
  #playerArea iframe { height: 320px; }
}
</style>
</head>
<body>

<!-- ── LOADER ── -->
<div id="loader">
  <div class="loader-logo">Stream<em>X</em></div>
  <div class="loader-bar-track">
    <div class="loader-bar-fill"></div>
  </div>
  <div class="loader-dots">
    <span></span><span></span><span></span>
  </div>
</div>

<!-- ── APP ── -->
<div id="app">
  <div class="wrap">

    <!-- Header -->
    <div class="top">
      <div class="logo">Stream<em>X</em></div>
      <div class="live-pill">
        <div class="live-dot"></div>
        HLS PLAYER
      </div>
    </div>

    <!-- Input -->
    <div class="input-section">
      <div class="input-row">
        <input
          type="url"
          id="urlInput"
          class="url-input"
          placeholder="Paste .m3u8 link here and press Play…"
          autocomplete="off"
          spellcheck="false"
        />
        <button class="play-btn" onclick="playStream()">
          <svg width="13" height="13" viewBox="0 0 12 12" fill="currentColor">
            <path d="M2 1.5l9 4.5-9 4.5V1.5z"/>
          </svg>
          Play
        </button>
      </div>
    </div>

    <!-- Player -->
    <div class="player-box">
      <div id="playerArea">
        <div class="state" id="emptyState">
          <div class="state-icon">📡</div>
          <h3>No Stream Loaded</h3>
          <p>Paste your M3U8 link above and press Play</p>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
  // Loader → App
  window.addEventListener('load', () => {
    setTimeout(() => {
      document.getElementById('loader').classList.add('out');
      document.getElementById('app').classList.add('visible');
    }, 2000);
  });

  // Enter key
  document.getElementById('urlInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') playStream();
  });

  function playStream() {
    const url = document.getElementById('urlInput').value.trim();
    if (!url) {
      document.getElementById('urlInput').focus();
      return;
    }

    const area = document.getElementById('playerArea');

    // Show loading spinner
    area.innerHTML = `
      <div class="state">
        <div class="spinner"></div>
        <h3>Loading Stream…</h3>
        <p>Opening player</p>
      </div>`;

    // Short delay then inject iframe
    setTimeout(() => {
      const enc = encodeURIComponent(url);
      const embedUrl = `https://hlsplayer.net/embed?type=mp4&src=${enc}`;

      area.innerHTML = '';
      const iframe = document.createElement('iframe');
      iframe.src = embedUrl;
      iframe.allowFullscreen = true;
      iframe.setAttribute('allow', 'autoplay; fullscreen; picture-in-picture; encrypted-media');
      iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-popups allow-presentation allow-pointer-lock');
      area.appendChild(iframe);
    }, 600);
  }
</script>
</body>
</html>
